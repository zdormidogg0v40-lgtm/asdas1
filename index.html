<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificación · Guía Staff</title>
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <main>
    <header class="logo">
      <div class="luna">🌙</div>
      <h1>Guía Staff</h1>
      <p>Verifícate para entrar a la guía</p>
    </header>

    <section class="tarjeta">
      <ol class="pasos">
        <li>Entra al servidor de Minecraft.</li>
        <li>Escribe <code>/verificar</code> en el chat.</li>
        <li>Copia aquí tu nombre y tu contraseña (dura 10 minutos).</li>
      </ol>
    </section>

    <section class="tarjeta">
      <form id="form" autocomplete="off">
        <label for="nombre">Nombre de Minecraft</label>
        <input id="nombre" required maxlength="16" placeholder="Steve" autocapitalize="off" spellcheck="false">

        <label for="password">Contraseña</label>
        <input id="password" type="password" required maxlength="40" placeholder="La que te dio /verificar">

        <button id="btn" type="submit">Verificar</button>
        <div id="msg" class="msg" role="status"></div>
      </form>
    </section>

    <p class="pie">¿Problemas? Escribe <code>/verificar</code> otra vez para recibir una contraseña nueva.</p>
  </main>

  <script>
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.className = "msg";
      msg.textContent = "Verificando…";
      try {
        const r = await fetch("/api/verificar", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            nombre: document.getElementById("nombre").value,
            password: document.getElementById("password").value,
          }),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || "No se pudo verificar.");
        localStorage.setItem("ns_token", d.token);
        localStorage.setItem("ns_nombre", d.nombre);
        msg.className = "msg ok";
        msg.textContent = "¡Verificado! Entrando…";
        location.href = "/guia.html";
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = err.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
